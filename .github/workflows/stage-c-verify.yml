name: AI-POS Stage C Verification
on:
  push:
    branches: [setup/stage-d-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  stage-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Stage C source presence
        run: |
          test -f stage-c/validator.py
          test -f stage-c/hardening.py
          test -f stage-c/release_gate.py
          test -f stage-c/requirements.txt
          test -d stage-c/schemas
          test -d stage-c/fixtures
      - name: Install pinned-compatible test dependencies
        run: python -m pip install -r stage-c/requirements.txt
      - name: Verify full Stage C regression
        working-directory: stage-c
        run: python -m pytest -q
