name: AI-POS Release Gate
on:
  push:
    branches: [main, setup/stage-d-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify founder approval and release eligibility
        run: python3 scripts/verify_release.py
