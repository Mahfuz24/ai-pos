name: AI-POS Controller Unit Tests
on:
  push:
    branches: [main, setup/stage-d-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  controller-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run controller unit tests
        run: python3 -m unittest discover -s controller -p 'test_*.py' -v
